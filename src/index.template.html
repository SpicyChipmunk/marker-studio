<script>
// (v322) the animation's end: once the page's script has all run and its last section is in, it fades off Home and goes.
// (Its start is the browser's: Safari's engine starts it as the page is first drawn, Chromium's once the script has run;
// so its own end, not a time, says when it's done.) A start that never finishes loading still loses it after 4 s
(function () {
  var el = document.getElementById('msIntro');
  if (!el || !document.documentElement.classList.contains('msintro-on')) {
    if (el) el.remove();
    return;
  }
  var gone = false,
    ready = 0,
    last = el.querySelectorAll('.msinf'),
    end = function () {
      if (gone) return;
      gone = true;
      el.classList.add('out');
      setTimeout(function () {
        el.remove();
        document.documentElement.classList.remove('msintro-on');
      }, 200);
    };
  var step = function () {
    if (++ready === 2) end();
  };
  last = last[last.length - 1];
  if (last) last.addEventListener('animationend', step, { once: true });
  else ready++;
  document.addEventListener('DOMContentLoaded', step, { once: true });
  // (a tap ends it at once; the tap itself goes no further)
  el.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    end();
  });
  el.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
  });
  setTimeout(end, 4000);
})();
</script>

<script>

// (v318.19) the names printed on older caps, beside the old codes (Ohuhu's "R6 Rose Red" is R213 Pomegranate): the
// reader takes them as the marker's own names, with their old codes only (docs/READER-CAP-NAMES.md)
(function (cn) {
  COLORS.forEach(function (c) {
    const n = cn[c.brand] && cn[c.brand][c.code];
    if (n) c.cap = n;
  });
})(@@json(data/cap-names.json));
// (v318.21) a short name printed on an older cap that the reader leaves out ("BG8 Teal", now BG215): shown only
(function (cn) {
  COLORS.forEach(function (c) {
    const n = cn[c.brand] && cn[c.brand][c.code];
    if (n && !c.cap) c.capN = n;
  });
})(@@json(data/cap-shown.json));
