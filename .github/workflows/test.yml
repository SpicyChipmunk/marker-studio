name: tests
on:
  push:
  pull_request:
# The runners are pinned to Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from 19 October 2026, and the browsers our
# Playwright version installs (npx playwright install --with-deps) are built for 24.04. Move on when Playwright is
# upgraded to a version that lists Ubuntu 26.
jobs:
  # Unit tests, then the browser tests on Chromium in 2 parts side by side (by file, as node --test --test-shard splits
  # them), so the results come in about half the time. The unit tests run in part 1 only.
  test:
    name: tests on Chromium, part ${{ matrix.part }} of 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each test step also records its results, and the Summary steps put any failures on the run's summary page.
      - name: Unit tests (includes "index.html is built from src/")
        if: matrix.part == 1
        run: >-
          mkdir -p e2e/.artifacts &&
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/ci-report.mjs --test-reporter-destination=stdout
          test/*.test.mjs
        env:
          E2E_REPORT: e2e/.artifacts/unit-results.jsonl
      - name: Summary (unit tests)
        if: always() && matrix.part == 1
        run: node e2e/ci-summary.mjs e2e/.artifacts/unit-results.jsonl "Unit tests" all test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (Chromium, part ${{ matrix.part }} of 2)
        run: >-
          mkdir -p e2e/.artifacts &&
          node --test --test-shard=${{ matrix.part }}/2 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/ci-report.mjs --test-reporter-destination=stdout
          e2e/*.test.mjs
        env:
          E2E_REPORT: e2e/.artifacts/chromium-results.jsonl
      - name: Summary (browser tests)
        if: always()
        run: node e2e/ci-summary.mjs e2e/.artifacts/chromium-results.jsonl "Browser tests (Chromium), part ${{ matrix.part }} of 2" ${{ matrix.part }}/2
      - name: Keep screenshots and PDFs from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-chromium-${{ matrix.part }}
          path: e2e/.artifacts
          # (the folder's name starts with a dot, and upload-artifact leaves hidden files out unless told)
          include-hidden-files: true
  # The same browser tests on WebKit, Safari's engine, to catch iPhone-only problems early.
  # Informational: a failure here shows up in the run but doesn't fail the build.
  # GitHub's WebKit now and then misses a frame or a scroll event when the machine is busy, so here the tests run one
  # file at a time, in 6 parts side by side, and a test that fails is run once more (e2e/ci-retry.mjs): one that then
  # passes is reported as flaky (a warning), one that fails again as a failure. Tests that can't pass on GitHub's WebKit
  # at all are left out, each with its reason (notOnWebKit in e2e/helpers.mjs). Each part's results go on the run's page.
  webkit:
    name: browser tests on WebKit (Safari's engine), part ${{ matrix.part }} of 6
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # (a diagnostic, part 1 only: how fast this WebKit runs plain JavaScript; about 180 ms with its JIT on a laptop)
      - name: WebKit speed check
        if: matrix.part == 1
        continue-on-error: true
        timeout-minutes: 5
        run: node e2e/ci-speed-check.mjs
      - name: Browser tests (WebKit, part ${{ matrix.part }} of 6)
        id: tests
        # failed tests don't fail this step: the retry below decides (and so does running out of time, which is why
        # a timeout here doesn't stop the job either)
        continue-on-error: true
        # a test file that hangs is stopped after 12 minutes instead of using up the whole run (node's limit applies to
        # each file as a whole as well as to each test in it)
        timeout-minutes: 30
        run: >-
          mkdir -p e2e/.artifacts &&
          (node --test --test-shard=${{ matrix.part }}/6 --test-concurrency=1 --test-timeout=720000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/ci-report.mjs --test-reporter-destination=stdout
          e2e/*.test.mjs || echo "Some tests failed: the retry below decides.")
        env:
          E2E_BROWSER: webkit
          E2E_REPORT: e2e/.artifacts/webkit-results.jsonl
      - name: Retry what failed (once)
        if: always() && steps.tests.outcome != 'skipped'
        timeout-minutes: 15
        run: node e2e/ci-retry.mjs e2e/.artifacts/webkit-results.jsonl e2e/.artifacts/webkit-retry.jsonl ${{ matrix.part }}/6
        env:
          E2E_BROWSER: webkit
      - name: Summary
        if: always()
        run: node e2e/ci-summary.mjs e2e/.artifacts/webkit-results.jsonl "WebKit, part ${{ matrix.part }} of 6" ${{ matrix.part }}/6
        env:
          E2E_RETRY: e2e/.artifacts/webkit-retry.jsonl
      - name: Keep screenshots and PDFs from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-webkit-${{ matrix.part }}
          path: e2e/.artifacts
          # (the folder's name starts with a dot, and upload-artifact leaves hidden files out unless told)
          include-hidden-files: true
